# Projecto do «Balcão»: o assistente de suporte ao cliente do «Chega».
# Uma só fonte de verdade para dependências, ferramentas de qualidade e testes.
# `uv sync` cria o ambiente e o `uv.lock`; a imagem Docker usa `uv sync --frozen`.

[project]
name = "balcao"
version = "0.1.0"
description = "Assistente de suporte ao cliente do «Chega»: RAG com pgvector, agente LangGraph e API FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Engenharia de IA do Chega" }]
dependencies = [
    # Serviço HTTP
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.37",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.10",
    "httpx>=0.28",
    # LangChain 1.x e integrações (adr-0012)
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-text-splitters>=1.0",
    "langchain-ollama>=1.0",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    "langchain-postgres>=0.0.16",
    # LangGraph 1.x e checkpoints no PostgreSQL (adr-0014)
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0",
    "psycopg[binary,pool]>=3.2",
    # Numérico (runtime didáctico, métricas)
    "numpy>=2.1",
    # MCP (adr-0017)
    "mcp>=1.20,<2",  # FastMCP; o SDK 2.x renomeou-o para MCPServer
    # Observabilidade (adr-0025)
    "opentelemetry-api>=1.37",
    "opentelemetry-sdk>=1.37",
    "prometheus-client>=0.23",
]

[project.scripts]
balcao-avaliar = "balcao.avaliacao.correr:main"
balcao-ingerir = "balcao.ingestao:main"
balcao-mcp = "balcao.mcp_servidor:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "ruff>=0.13",
    "mypy>=1.18",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balcao"]

# ------------------------------------------------------------------ qualidade

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]
# O runtime didáctico e o corpus também correm no browser (Pyodide) e têm
# formatação própria, pensada para ser lida no tutorial: ficam fora do lint.
extend-exclude = ["src/balcao/didactico.py", "src/balcao/corpus.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # aspas «» e travessões são português, não ambiguidade
    "S101",                        # assert nos testes
    "S311",                        # random não criptográfico chega para bootstrap
    "B008",                        # Depends() em argumentos por omissão é o idioma do FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["balcao"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Os protocolos `TypedDictLike` do LangGraph não reconhecem um TypedDict no mypy
# (`StateGraph.add_node` com uma função): falso positivo conhecido, só neste módulo.
module = ["balcao.grafo"]
disable_error_code = ["call-overload"]

[[tool.mypy.overrides]]
# Código didáctico: tipado de forma leve de propósito (corre também no browser).
module = ["balcao.didactico", "balcao.corpus"]
ignore_errors = true

# ---------------------------------------------------------------------- testes

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "postgres: precisa de PostgreSQL com pgvector (DATABASE_URL); saltado sem ele",
    "lento: testes mais demorados (avaliação completa)",
]
filterwarnings = ["ignore::DeprecationWarning"]
